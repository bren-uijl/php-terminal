<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Terminal</title>
    <!-- Xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    
    <!-- CaskaydiaCove Nerd Font via jsDelivr -->
    <style>
        @font-face {
            font-family: 'CaskaydiaCove Nerd Font';
            src: url('https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@master/patched-fonts/CascadiaCode/Regular/CaskaydiaCoveNerdFont-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
        }

        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .xterm .xterm-viewport {
            overflow-y: auto !important;
        }

        /* Custom Scrollbar for a more terminal-like feel */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 5px;
            border: 2px solid #1e1e1e;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>

<div id="terminal-container"></div>

<!-- Xterm.js JS -->
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<!-- Xterm.js Addon: Fit (to make the terminal fill the entire div) -->
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

<script>
    const term = new Terminal({
        fontFamily: "'CaskaydiaCove Nerd Font', monospace",
        fontSize: 16,
        theme: {
            background: '#1e1e1e',
            foreground: '#d4d4d4',
            cursor: '#ffffff'
        },
        cursorBlink: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    window.addEventListener('resize', () => {
        fitAddon.fit();
    });

    // Terminal State
    let cwd = '/';
    let user = 'admin';
    let host = 'php-server';
    let promptFormat = '{user}@{host} {cwd}> ';
    
    // Auth Configuration
    let currentUsername = sessionStorage.getItem('php_term_user') || '';
    let currentPassword = sessionStorage.getItem('php_term_pass') || '';

    function getAuthHeader() {
        return 'Basic ' + btoa(currentUsername + ':' + currentPassword);
    }

    async function checkAuthAndSetup() {
        try {
            const response = await fetch('api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': getAuthHeader()
                },
                body: JSON.stringify({ command_line: 'echo init' })
            });
            
            const result = await response.json();
            
            if (result.require_setup) {
                term.writeln('\x1b[1;33m[FIRST STARTUP] System requires initialization.\x1b[0m');
                let newAdmin = prompt("First Startup! Choose an Admin Username:");
                let newPass = prompt("Choose an Admin Password:");
                
                if (newAdmin && newPass) {
                    const setupRes = await fetch('api.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ setup_user: newAdmin, setup_pass: newPass })
                    });
                    const setupResult = await setupRes.json();
                    if (setupResult.exit_code === 0) {
                        term.writeln(setupResult.output.replace(/\n/g, '\r\n'));
                        currentUsername = newAdmin;
                        currentPassword = newPass;
                        sessionStorage.setItem('php_term_user', currentUsername);
                        sessionStorage.setItem('php_term_pass', currentPassword);
                    }
                } else {
                    throw new Error("Setup aborted.");
                }
            } else if (response.status === 401) {
                let user = prompt("🔒 Enter Username:");
                let pass = prompt("🔒 Enter Password:");
                if (user && pass) {
                    currentUsername = user;
                    currentPassword = pass;
                    sessionStorage.setItem('php_term_user', currentUsername);
                    sessionStorage.setItem('php_term_pass', currentPassword);
                    return checkAuthAndSetup(); // Retry
                } else {
                    document.body.innerHTML = '<h2 style="color:red; text-align:center; font-family:sans-serif; margin-top: 50px;">Access Denied.</h2>';
                    throw new Error("Login aborted.");
                }
            }
            
            user = currentUsername;
            writePrompt();
        } catch (e) {
            console.error(e);
        }
    }

    term.writeln('Welcome to the PHP Web Terminal.');
    term.writeln('Type "help" to see available commands.');
    
    // Start login / setup flow
    if (window.location.protocol === 'file:') {
        term.writeln('\x1b[1;31m[ERROR] Security Exception:\x1b[0m');
        term.writeln('The terminal cannot run via the \x1b[33mfile://\x1b[0m protocol.');
        term.writeln('Please host these files on a web server with PHP support.');
        term.writeln('');
        term.writeln('Try using: \x1b[1;32mphp -S localhost:8000\x1b[0m in this directory.');
    } else {
        checkAuthAndSetup();
    }

    function getPrompt() {
        return promptFormat
            .replace('{user}', `\x1b[1;32m${user}\x1b[0m`) // Green user
            .replace('{host}', `\x1b[1;32m${host}\x1b[0m`)
            .replace('{cwd}', `\x1b[1;34m${cwd}\x1b[0m`);   // Blue cwd
    }

    function writePrompt() {
        term.write('\r\n' + getPrompt());
    }

    let currentInput = '';
    let commandHistory = [];
    let historyIndex = -1;

    term.onKey(e => {
        const ev = e.domEvent;
        const printable = !ev.altKey && !ev.ctrlKey && !ev.metaKey;

        if (ev.keyCode === 13) { // Enter
            if (currentInput.trim() !== '') {
                commandHistory.push(currentInput);
                historyIndex = commandHistory.length;
                term.writeln('');
                executeCommand(currentInput);
            } else {
                writePrompt();
            }
            currentInput = '';
        } else if (ev.keyCode === 8) { // Backspace
            if (currentInput.length > 0) {
                term.write('\b \b');
                currentInput = currentInput.slice(0, -1);
            }
        } else if (ev.keyCode === 38) { // Up Arrow
            if (historyIndex > 0) {
                historyIndex--;
                // Clear current line
                while (currentInput.length > 0) {
                    term.write('\b \b');
                    currentInput = currentInput.slice(0, -1);
                }
                currentInput = commandHistory[historyIndex];
                term.write(currentInput);
            }
        } else if (ev.keyCode === 40) { // Down Arrow
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                while (currentInput.length > 0) {
                    term.write('\b \b');
                    currentInput = currentInput.slice(0, -1);
                }
                currentInput = commandHistory[historyIndex];
                term.write(currentInput);
            } else if (historyIndex === commandHistory.length - 1) {
                historyIndex++;
                while (currentInput.length > 0) {
                    term.write('\b \b');
                    currentInput = currentInput.slice(0, -1);
                }
                currentInput = '';
            }
        } else if (ev.keyCode === 37 || ev.keyCode === 39) {
            // Left / Right arrow (ignore for now to prevent ANSI injection)
        } else if (printable && ev.key.length === 1) {
            currentInput += e.key;
            term.write(e.key);
        }
    });

    async function executeCommand(cmdString) {
        try {
            const response = await fetch('api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': getAuthHeader()
                },
                body: JSON.stringify({
                    command_line: cmdString,
                    cwd: cwd
                })
            });

            if (response.status === 401) {
                term.writeln(`\x1b[31mError:\x1b[0m Session expired or invalid credentials.`);
                sessionStorage.clear();
                return;
            }

            const result = await response.json();

            if (result.error) {
                term.writeln(`\x1b[31mError:\x1b[0m ${result.error}`);
            } else {
                if (result.output) {
                    // Convert newlines to terminal newlines
                    term.write(result.output.replace(/\n/g, '\r\n'));
                }
                if (result.new_cwd) {
                    cwd = result.new_cwd;
                }
            }
        } catch (error) {
            term.writeln(`\x1b[31mNetwork Error:\x1b[0m ${error.message}`);
        }
        
        writePrompt();
    }
</script>

</body>
</html>
